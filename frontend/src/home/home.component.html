<div class="sm:grid h-screen md:grid-cols-12 sm:grid-cols-2 grid-cols-1 grid-rows-12 hidden">
  <section class=" shadow-md row-span-1 md:col-span-12 sm:col-span-2 col-span-1 rounded-b-xl border"><app-header/></section>
  <main class="row-span-11 overflow-y-auto overflow-x-hidden flex flex-col md:col-span-12 sm:col-span-2 col-span-1">
    <section class="flex-grow"><router-outlet/></section>
    <section class=" shadow-md h-fit border-t">
      <app-footer/>
    </section>
  </main>
</div>

<div class="h-screen block sm:hidden">
  <mat-drawer-container class="example-container">
    <mat-drawer mode="over" (closed)="open.set(false)" [opened]="open()">

      <div class="sidebare">
        <div class="h-[60px] border-b px-6 py-4 flex justify-between items-center">

          <!-- Logo -->
          <a href="#" class="text-2xl font-bold text-gray-900 flex items-center">
            <span class="text-green-600">Local</span>Bazaar
          </a>
          <button mat-icon-button  (click)="open.set(false)"><mat-icon>close</mat-icon></button>
        </div>
        <nav class="flex flex-col flex-grow space-y-4 p-4">
          <a routerLink="/products" (click)="open.set(false)">Products</a>
          <a routerLink="/shops" (click)="open.set(false)">Shops</a>
          <a href="#" class="text-gray-700 hover:text-green-600">Promotions</a>
          <a href="#" class="text-gray-700 hover:text-green-600">Contact</a>
        </nav>
        <div class="h-[100px] w-full  border-t">
          <h1 class="text-center text-2xl font-bold mt-4">&copy; 2025</h1>
        </div>
      </div>
    </mat-drawer>
    <mat-drawer-content>
      <h1 class="flex justify-between items-center mb-5 shadow-md h-16"><button mat-icon-button color="surface" (click)="open.set(!open())"><mat-icon >menu</mat-icon></button><span class="mr-3">Hello</span></h1>
      <main class="overflow-y-auto overflow-x-hidden flex flex-col">
        <section class="flex-grow"><router-outlet/></section>
        <section class=" shadow-md h-fit w-full flex items-center border-t">
          <app-footer/>
        </section>
      </main>
    </mat-drawer-content>
  </mat-drawer-container>
</div>
